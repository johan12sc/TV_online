<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Télé en ligne</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="entete">
    <h1><span class="point"></span> Télé en ligne</h1>
    <div class="outils">
      <button id="reverifier" title="Retélécharger la playlist et retester toutes les chaînes">Revérifier</button>
      <select id="pays" aria-label="Pays">
        {% for code, nom in pays.items() %}
          <option value="{{ code }}">{{ nom }}</option>
        {% endfor %}
      </select>
    </div>
  </header>

  <main class="page">

    <!-- Lecteur -->
    <section class="lecteur">
      <div class="ecran">
        <video id="video" controls autoplay playsinline></video>
        <div id="message" class="message">Choisis une chaîne dans la liste</div>
      </div>
      <div class="en-cours">
        <img id="logo-en-cours" alt="" hidden>
        <div>
          <div id="nom-en-cours" class="nom-en-cours">Aucune chaîne</div>
          <div id="categorie-en-cours" class="discret"></div>
        </div>
      </div>
    </section>

    <!-- Liste des chaînes -->
    <aside class="liste">
      <input id="recherche" type="search" placeholder="Rechercher une chaîne…" aria-label="Rechercher">
      <div id="categories" class="categories"></div>
      <div id="compteur" class="discret compteur"></div>
      <ul id="chaines" class="chaines"></ul>
    </aside>

  </main>

  <!-- hls.js (copie locale) : lit les flux .m3u8 dans les navigateurs qui ne le font pas tout seuls -->
  <script src="{{ url_for('static', filename='hls.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
